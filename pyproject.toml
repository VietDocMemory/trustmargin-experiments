[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmargin-exp"
version = "0.1.0"
description = "Experimental Doc-to-LoRA versus RAG TrustMargin arbitration"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "pypdf>=5", "rouge-score>=0.1.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
